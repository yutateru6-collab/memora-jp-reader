name: QA Screenshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Verify exact user material parser and safe repairs
        run: |
          npx esbuild lib/readingMaterialImport.ts --bundle --platform=node --format=esm --outfile=/tmp/memora-reading-import.mjs
          node tools/import-parser-smoke.mjs

      - name: Verify Japanese Reader schema and safe persistence
        run: |
          npm run qa:jp-import
          npm run qa:jp-db

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium webkit

      - name: Start Vite app
        run: |
          npm run dev > /tmp/memora-vite.log 2>&1 &
          echo $! > /tmp/memora-vite.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memora-vite.log || true
          exit 1

      - name: Run responsive browser QA
        run: node tools/capture-screenshots.mjs
        env:
          APP_URL: http://127.0.0.1:3000
          QA_REPOSITORY: ${{ github.repository }}
          QA_COMMIT_SHA: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_NUMBER: ${{ github.run_number }}
          QA_EVENT_NAME: ${{ github.event_name }}

      - name: Run READON knowledge depth QA
        run: node tools/knowledge-depth-qa.mjs
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Run exact, atomic, and tolerant READON import QA
        run: node tools/readon-strict-contract-qa.mjs
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Run iPhone WebKit regression QA
        if: always()
        run: node tools/mobile-webkit-regression.mjs
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Run Japanese Reader responsive QA
        if: always()
        run: node tools/jp-reader-browser-qa.mjs
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Publish latest QA evidence
        if: always()
        env:
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/qa-latest/screenshots
          if [ -f qa-artifacts/report.json ]; then
            cp qa-artifacts/report.json /tmp/qa-latest/report.json
          fi
          if [ -d qa-artifacts/screenshots ]; then
            cp -R qa-artifacts/screenshots/. /tmp/qa-latest/screenshots/
          fi

          SCREENSHOT_COUNT="$(find /tmp/qa-latest/screenshots -type f 2>/dev/null | wc -l | tr -d ' ')"
          QA_STATUS="failure"
          if [ -f /tmp/qa-latest/report.json ]; then
            QA_STATUS="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/qa-latest/report.json','utf8'));process.stdout.write(r.status||'failure')")"
          fi

          cat > /tmp/qa-latest/latest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "QA Screenshots",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "commit_sha": "${GITHUB_SHA}",
            "job_status": "${QA_JOB_STATUS}",
            "qa_status": "${QA_STATUS}",
            "screenshot_count": ${SCREENSHOT_COUNT},
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          if [ -f /tmp/memora-vite.pid ]; then
            kill "$(cat /tmp/memora-vite.pid)" >/dev/null 2>&1 || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan qa-latest-temp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R /tmp/qa-latest/. .
          git add latest.json
          if [ -f report.json ]; then git add report.json; fi
          if [ -d screenshots ]; then git add screenshots/; fi
          git commit -m "Update latest QA evidence"
          git push --force origin HEAD:qa-latest
