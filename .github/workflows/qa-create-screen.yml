name: QA Create Screen

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  create-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify production build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium webkit

      - name: Start Vite app
        run: |
          npm run dev > /tmp/memora-create-vite.log 2>&1 &
          echo $! > /tmp/memora-create-vite.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memora-create-vite.log || true
          exit 1

      - name: Capture and verify Japanese creation screen
        run: node tools/jp-create-screen-qa.mjs
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Retain creation-screen evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-create-evidence-${{ github.run_id }}
          path: qa-artifacts/jp-create/
          if-no-files-found: warn
          retention-days: 1
