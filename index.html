<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#312e81" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="日本語MEMORA" />
    <title>MEMORA Japanese Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=RocknRoll+One&display=swap" rel="stylesheet">
    <style>
      body { overscroll-behavior-y: contain; }
      @keyframes slide-in-right { 0% { transform: translateX(8px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes slide-in-left { 0% { transform: translateX(-8px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
      .animate-slide-in-right { animation: slide-in-right 0.08s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-slide-in-left { animation: slide-in-left 0.08s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-fade-in { animation: fade-in 0.08s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",

        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"

    }

  </body>
</html>
